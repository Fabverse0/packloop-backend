          description: Detail setoran dan log tracking daur ulang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Batalkan / Hapus Transaksi Setoran
      description: |
        Membatalkan dan menghapus transaksi setoran milik pengguna (hanya berlaku jika status masih `DEPOSITED`).
