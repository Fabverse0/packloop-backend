openapi: 3.0.3
info:
  title: PackLoop Backend Core API Documentation
  description: |
    Dokumentasi resmi OpenAPI 3.0 & API Reference untuk aplikasi **PackLoop** (Mobile Client & IoT Stations).
    
    ### Fitur Utama:
    * **Autentikasi**: Supabase Auth (Google OAuth & Phone OTP verification).
    * **Dashboard & Profile**: Rekap total kemasan terserap, total poin reward, dan carbon saved.
    * **Peta & Stasiun IoT**: Lokasi PackCycle Station & kapasitas kompartemen real-time (Kardus, Bubble Wrap, Tote Bag).
    * **Setor Kemasan (Drop-off)**: Pencatatan setoran, auto-kalkulasi poin & karbon, serta order tracking daur ulang.
    * **Reward & E-Wallet**: Konversi poin ke Gopay, OVO, Dana, LinkAja.
    * **Notifikasi**: Notifikasi real-time & alert pickup stasiun.
  version: 1.0.0
  contact:
    name: Tim Pengembang PackLoop
    url: https://github.com/Fabverse0/packloop-backend

servers:
  - url: http://localhost:5000
    description: Server Lokal (Development)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan Supabase JWT Access Token (didapatkan dari login Supabase Auth).

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil memproses permintaan
        data:
          type: object

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 53c82597-7e19-4f35-affa-aac08022c634
        full_name:
          type: string
          example: Indy Agustin
        phone_number:
          type: string
          example: "081234567890"
        avatar_url:
          type: string
          example: https://lh3.googleusercontent.com/a/ACg8ocL...
        total_points:
          type: integer
          example: 1250
        total_weight_kg:
          type: number
          format: float
          example: 50.00
        total_carbon_saved_kg:
          type: number
          format: float
          example: 75.00
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Station:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Halte Transjakarta CSW
        address:
          type: string
          example: Jl. Trunojoyo, Kebayoran Baru, Jakarta Selatan
        latitude:
          type: number
          format: float
          example: -6.2403
        longitude:
          type: number
          format: float
          example: 106.7984
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, OFFLINE]
          example: ACTIVE
        compartments:
          type: array
          items:
            $ref: '#/components/schemas/Compartment'

    Compartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1111111-1111-1111-1111-111111111111
        station_id:
          type: string
          format: uuid
        waste_type:
          type: string
          enum: [CARDBOARD, BUBBLE_WRAP, TOTE_BAG]
          example: CARDBOARD
        current_weight_kg:
          type: number
          format: float
          example: 60.00
        max_capacity_kg:
          type: number
          format: float
          example: 150.00
        status:
          type: string
          enum: [AVAILABLE, ALMOST_FULL, FULL]
          example: AVAILABLE

    WasteTypeConfig:
      type: object
      properties:
        waste_type:
          type: string
          enum: [CARDBOARD, BUBBLE_WRAP, TOTE_BAG]
          example: CARDBOARD
        name:
          type: string
          example: Kardus
        unit:
          type: string
          enum: [GRAM, ITEM]
          example: GRAM
        reward_points_per_unit:
          type: integer
          example: 10
        carbon_saved_per_unit_kg:
          type: number
          format: float
          example: 1.5

    Deposit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_code:
          type: string
          example: PL-20260722-159
        user_id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        compartment_id:
          type: string
          format: uuid
        waste_type:
          type: string
          enum: [CARDBOARD, BUBBLE_WRAP, TOTE_BAG]
          example: CARDBOARD
        weight_or_count:
          type: number
          format: float
          example: 1.2
        reward_points_earned:
          type: integer
          example: 120
        carbon_saved_kg:
          type: number
          format: float
          example: 1.8
        status:
          type: string
          enum: [DEPOSITED, SORTED, PICKED_UP, IN_TRANSIT, RECYCLED]
          example: DEPOSITED
        recycled_percentage:
          type: number
          format: float
          example: 85.0
        recycle_partner:
          type: string
          example: Rekosistem / Paxel
        recycle_notes:
          type: string
          example: 1.2kg kardus diterima & terverifikasi.
        created_at:
          type: string
          format: date-time

    RewardRedemption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        e_wallet_provider:
          type: string
          enum: [GOPAY, OVO, DANA, LINKAJA]
          example: GOPAY
        account_number:
          type: string
          example: "081234567890"
        points_redeemed:
          type: integer
          example: 500
        amount_idr:
          type: number
          format: float
          example: 50.00
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
          example: SUCCESS
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: Setoran Berhasil!
        message:
          type: string
          example: Setoran 1.2 kg kardus berhasil. +120 poin reward.
        type:
          type: string
          enum: [DEPOSIT_SUCCESS, STATION_ALERT, RECYCLE_UPDATE, REDEMPTION]
          example: DEPOSIT_SUCCESS
        is_read:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time

paths:
  /:
    get:
      summary: Health Check Server
      description: Memeriksa status kesehatan server backend Express.
      responses:
        '200':
          description: Server berjalan lancar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/verify-token:
    post:
      tags:
        - Autentikasi
      summary: Verifikasi Supabase Auth Token
      description: Memverifikasi JWT token dari login Supabase (Google/Phone OTP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJFUzI1NiIs...
      responses:
        '200':
          description: Token valid.
        '401':
          description: Token tidak valid.

  /api/auth/me:
    get:
      tags:
        - Autentikasi
      summary: Ambil Data Sesi Pengguna Aktif
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data pengguna aktif dikembalikan.
        '401':
          description: Akses ditolak.

  /api/users/profile:
    get:
      tags:
        - User Profile & Dashboard
      summary: Ambil Profil & Dasbor Pengguna
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data profil dan rekap dasbor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Profile'
        '401':
          description: Akses ditolak.

    put:
      tags:
        - User Profile & Dashboard
      summary: Update Profil Pengguna
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Indy Agustin
                phone_number:
                  type: string
                  example: "081234567890"
                avatar_url:
                  type: string
                  example: https://avatar.url/image.jpg
      responses:
        '200':
          description: Profil berhasil di-update.

    delete:
      tags:
        - User Profile & Dashboard
      summary: Hapus Akun & Seluruh Data Pengguna
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Akun terhapus permanen.

  /api/stations:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Daftar Seluruh Stasiun & Kapasitas Kompartemen
      responses:
        '200':
          description: Daftar stasiun dan kompartemen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'

  /api/stations/{id}:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Detail 1 Stasiun Spesifik
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail stasiun.
        '404':
          description: Stasiun tidak ditemukan.

  /api/stations/{id}/compartments:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Kapasitas Kompartemen Real-Time Stasiun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar kompartemen.

  /api/deposits:
    post:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Catat Transaksi Setor Kemasan Baru (Scan QR/IoT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stationId
                - compartmentId
                - wasteType
                - weightOrCount
              properties:
                stationId:
                  type: string
                  format: uuid
                  example: 11111111-1111-1111-1111-111111111111
                compartmentId:
                  type: string
                  format: uuid
                  example: a1111111-1111-1111-1111-111111111111
                wasteType:
                  type: string
                  enum: [CARDBOARD, BUBBLE_WRAP, TOTE_BAG]
                  example: CARDBOARD
                weightOrCount:
                  type: number
                  format: float
                  example: 1.2
      responses:
        '201':
          description: Setoran berhasil dicatat (+poin & +karbon).

    get:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Ambil Riwayat Setoran Milik User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar setoran.

  /api/deposits/{id}:
    get:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Ambil Detail Setoran & Timeline Order Tracking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail setoran & log tracking.

    delete:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Batalkan / Hapus Transaksi Setoran
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Setoran dibatalkan.

  /api/rewards/rules:
    get:
      tags:
        - Reward & E-Wallet
      summary: Ambil Aturan Poin & Karbon per Jenis Kemasan
      responses:
        '200':
          description: Aturan reward.

  /api/rewards/redeem:
    post:
      tags:
        - Reward & E-Wallet
      summary: Konversi Poin ke E-Wallet (Min. 500 Poin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eWalletProvider
                - accountNumber
                - pointsRedeemed
              properties:
                eWalletProvider:
                  type: string
                  enum: [GOPAY, OVO, DANA, LINKAJA]
                  example: GOPAY
                accountNumber:
                  type: string
                  example: "081234567890"
                pointsRedeemed:
                  type: integer
                  example: 500
      responses:
        '201':
          description: Penukaran poin berhasil.

  /api/rewards/history:
    get:
      tags:
        - Reward & E-Wallet
      summary: Ambil Riwayat Penukaran Poin User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Riwayat penukaran poin.

  /api/rewards/history/{id}:
    delete:
      tags:
        - Reward & E-Wallet
      summary: Batalkan Permintaan Penukaran Poin (Status PENDING)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Penukaran dibatalkan & poin dikembalikan.

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: Ambil Daftar Notifikasi User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar notifikasi.

    delete:
      tags:
        - Notifications
      summary: Bersihkan Seluruh Notifikasi User (Clear All)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Seluruh notifikasi dibersihkan.

  /api/notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Hapus 1 Notifikasi Tertentu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notifikasi terhapus.

  /api/notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Tandai Notifikasi Sebagai Telah Dibaca
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notifikasi telah dibaca.
