  /api/rewards/redeem:
    post:
      tags:
        - Reward & E-Wallet
      summary: Konversi Poin ke E-Wallet (Min. 500 Poin)
      description: |
        Mengajukan penukaran poin reward pengguna menjadi saldo E-Wallet (GoPay, OVO, DANA, LinkAja).
        Sistem backend akan memverifikasi saldo poin dan memotong poin secara otomatis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eWalletProvider
                - accountNumber
                - pointsRedeemed
              properties:
                eWalletProvider:
                  type: string
                  enum: [GOPAY, OVO, DANA, LINKAJA]
                  description: Provider e-wallet tujuan
                  example: GOPAY
                accountNumber:
                  type: string
                  description: Nomor HP / akun e-wallet terdaftar
                  example: "081234567890"
                pointsRedeemed:
                  type: integer
                  description: Jumlah poin yang ingin ditukarkan (Minimal 500 poin). Harus angka positif > 0.
                  example: 500
      responses:
        '201':
          description: Permintaan penukaran poin berhasil diproses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Penukaran poin berhasil diproses!
                data:
                  id: 88888888-8888-8888-8888-888888888888
                  e_wallet_provider: GOPAY
                  account_number: "081234567890"
                  points_redeemed: 500
                  amount_idr: 5000
                  status: PENDING
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

