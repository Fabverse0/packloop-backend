openapi: 3.0.3
info:
  title: PackLoop Backend Core API Documentation
  description: |
    Dokumentasi resmi OpenAPI 3.0 & API Reference lengkap untuk aplikasi **PackLoop** (Mobile Client & IoT Stations).
    
    ### 🌿 Tentang PackLoop:
    PackLoop adalah platform daur ulang kemasan belanja bekas (kardus, bubble wrap, tote bag) berbasis IoT dan kompensasi reward. 
    Aplikasi ini terhubung langsung dengan **PackCycle Station** di berbagai lokasi strategis.
    
    ### 🔑 Panduan Autentikasi:
    1. Lakukan login melalui Supabase Auth di aplikasi mobile.
    2. Salin `access_token` (JWT Token) yang didapatkan.
    3. Pada Scalar API Reference ini, klik tombol **Authorize** / **Bearer Auth** di bagian kanan atas atau pada setiap endpoint.
    4. Masukkan token dengan format `Bearer <TOKEN_JWT_SUPABASE>`.
    
    ### 🛠️ Fitur Utama API:
    * **Autentikasi**: Supabase Auth (Google OAuth & Phone OTP).
    * **Dashboard & Profile**: Rekap total kemasan terserap, total poin reward, dan perkiraan *carbon saved*.
    * **Peta & Stasiun IoT**: Lokasi stasiun fisik & pantauan kapasitas kompartemen real-time.
    * **Setor Kemasan (Drop-off)**: Pencatatan setoran, kalkulasi poin/karbon instan, serta *order tracking daur ulang*.
    * **Reward & E-Wallet**: Konversi poin ke GoPay, OVO, DANA, dan LinkAja.
    * **Notifikasi**: Alert real-time transaksi & update proses daur ulang.
  version: 1.0.0
  contact:
    name: Tim Pengembang Backend PackLoop
    url: https://github.com/Fabverse0/packloop-backend

servers:
  - url: https://packloop-backend-beryl.vercel.app
    description: Server Produksi (Vercel Cloud)
  - url: http://localhost:5000
    description: Server Lokal (Development)

tags:
  - name: Autentikasi
    description: Endpoint untuk manajemen sesi login, verifikasi Supabase JWT Token, dan pengambil data user aktif.
  - name: User Profile & Dashboard
    description: Pengelolaan profil pengguna, update data pribadi, rekap statistik (total poin, total kg kemasan, carbon saved), dan hapus akun.
  - name: Maps & Stasiun PackCycle
    description: Informasi lokasi stasiun drop-off fisik (PackCycle Station), koordinat lat/lng, dan pantauan kapasitas kompartemen real-time.
  - name: Setor Kemasan (Drop-off)
    description: Alur setor kemasan daur ulang (kardus, bubble wrap, tote bag), pencatatan timbangan, kalkulasi otomatis poin & karbon, order tracking timeline, dan pembatalan setoran.
  - name: Reward & E-Wallet
    description: Aturan perhitungan reward, transaksi penukaran poin ke E-Wallet (GoPay, OVO, DANA, LinkAja), dan riwayat/pembatalan penukaran.
  - name: Notifications
    description: Notifikasi real-time transaksi setoran, alert kapasitas stasiun, update status daur ulang, dan pengelolaan notifikasi user.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan Supabase JWT Access Token yang didapatkan setelah login pengguna.

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indikator keberhasilan operasi (true/false)
          example: true
        message:
          type: string
          description: Pesan penjelasan hasil eksekusi API
          example: Berhasil memproses permintaan
        data:
          type: object
          description: Data utama hasil kembalian API

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Selalu bernilai false pada skenario error
          example: false
        message:
          type: string
          description: Pesan penjelasan ramah pengguna tentang penyebab kesalahan
          example: Field stationId, compartmentId, wasteType, dan weightOrCount wajib diisi
        error:
          type: string
          nullable: true
          description: Detail teknis error (stack trace/sistem error) jika dalam mode dev, atau null
          example: null

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID unik pengguna dari Supabase Auth
          example: 53c82597-7e19-4f35-affa-aac08022c634
        full_name:
          type: string
          description: Nama lengkap pengguna
          example: Indy Agustin
        phone_number:
          type: string
          description: Nomor telepon terverifikasi
          example: "081234567890"
        avatar_url:
          type: string
          description: URL foto profil pengguna
          example: https://lh3.googleusercontent.com/a/ACg8ocL...
        total_points:
          type: integer
          description: Total akumulasi poin reward aktif saat ini
          example: 1250
        total_weight_kg:
          type: number
          format: float
          description: Total berat (kg) seluruh kemasan yang telah disetor
          example: 50.00
        total_carbon_saved_kg:
          type: number
          format: float
          description: Estimasi emisi karbon (kg CO2e) yang berhasil dihemat
          example: 75.00
        created_at:
          type: string
          format: date-time
          description: Waktu pendaftaran akun
        updated_at:
          type: string
          format: date-time
          description: Waktu pembaruan profil terakhir

    Station:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID unik stasiun PackCycle
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          description: Nama stasiun / lokasi landmark
          example: Halte Transjakarta CSW
        address:
          type: string
          description: Alamat fisik lengkap stasiun
          example: Jl. Trunojoyo, Kebayoran Baru, Jakarta Selatan
        latitude:
          type: number
          format: float
          description: Koordinat garis lintang (latitude) untuk Peta/Maps
          example: -6.2403
        longitude:
          type: number
          format: float
          description: Koordinat garis bujur (longitude) untuk Peta/Maps
          example: 106.7984
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, FULL]
          description: Status operasional stasiun fisik
          example: ACTIVE
        created_at:
          type: string
          format: date-time

    Compartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID unik kompartemen di dalam stasiun
          example: a1111111-1111-1111-1111-111111111111
        station_id:
          type: string
          format: uuid
          description: ID stasiun pemilik kompartemen ini
        waste_type:
          type: string
          enum: [TOTE_BAG, PAPER_BAG]
          description: Jenis kemasan spesifik yang ditampung kompartemen ini
          example: CARDBOARD
        current_weight_kg:
          type: number
          format: float
          description: Berat muatan kemasan saat ini di dalam kompartemen (kg)
          example: 60.00
        max_capacity_kg:
          type: number
          format: float
          description: Kapasitas maksimal penampungan kompartemen (kg)
          example: 150.00
        status:
          type: string
          enum: [AVAILABLE, ALMOST_FULL, FULL]
          description: Status ketersediaan penampungan kompartemen
          example: AVAILABLE

    WasteTypeConfig:
      type: object
      properties:
        waste_type:
          type: string
          enum: [TOTE_BAG, PAPER_BAG]
          description: Kode unik jenis kemasan
          example: CARDBOARD
        display_name:
          type: string
          description: Nama tampilan jenis kemasan di aplikasi
          example: Kardus Bekas
        reward_points_per_unit:
          type: integer
          description: Poin reward per unit/kg kemasan
          example: 100
        points_unit_type:
          type: string
          description: Satuan ukuran (KG / UNIT)
          example: KG
        points_per_kg:
          type: integer
          description: Konversi poin per kilogram
          example: 100
        carbon_saved_per_unit_kg:
          type: number
          format: float
          description: Faktor pengurang karbon per kg kemasan
          example: 1.5

    Deposit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID unik transaksi setoran
        order_code:
          type: string
          description: Kode unik tracking transaksi (format: PL-YYYYMMDD-XXX)
          example: PL-20260722-159
        user_id:
          type: string
          format: uuid
          description: UUID pengguna penyetor
        station_id:
          type: string
          format: uuid
          description: UUID stasiun lokasi penyetoran
        compartment_id:
          type: string
          format: uuid
          description: UUID kompartemen lokasi penyetoran
        waste_type:
          type: string
          enum: [TOTE_BAG, PAPER_BAG]
          description: Jenis kemasan yang disetor
          example: CARDBOARD
        weight_or_count:
          type: number
          format: float
          description: Berat (kg) atau jumlah unit kemasan yang disetor
          example: 1.2
        reward_points_earned:
          type: integer
          description: Total poin reward yang berhasil diperoleh dari setoran ini
          example: 120
        carbon_saved_kg:
          type: number
          format: float
          description: Total emisi karbon (kg CO2e) yang dihemat dari setoran ini
          example: 1.8
        status:
          type: string
          enum: [DEPOSITED, SORTED, PICKED_UP, IN_TRANSIT, RECYCLED]
          description: Status tracking proses daur ulang
          example: DEPOSITED
        recycled_percentage:
          type: number
          format: float
          description: Persentase progres daur ulang (0 - 100%)
          example: 85.0
        recycle_partner:
          type: string
          description: Mitra daur ulang pelaksana
          example: Rekosistem / Paxel
        recycle_notes:
          type: string
          description: Catatan verifikasi fisik dari mitra daur ulang
          example: 1.2kg kardus diterima & terverifikasi.
        created_at:
          type: string
          format: date-time
          description: Waktu transaksi dibuat

    RewardRedemption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID transaksi penukaran poin
        user_id:
          type: string
          format: uuid
        e_wallet_provider:
          type: string
          enum: [GOPAY, OVO, DANA, LINKAJA]
          description: Provider e-wallet tujuan penukaran
          example: GOPAY
        account_number:
          type: string
          description: Nomor HP / akun e-wallet tujuan
          example: "081234567890"
        points_redeemed:
          type: integer
          description: Jumlah poin yang dikonversi
          example: 500
        amount_idr:
          type: number
          format: float
          description: Nominal rupiah hasil konversi (1 poin = Rp 10)
          example: 5000.00
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
          description: Status pemrosesan transfer e-wallet
          example: SUCCESS
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          description: Judul notifikasi
          example: Setoran Berhasil!
        message:
          type: string
          description: Isi pesan notifikasi
          example: Setoran 1.2 kg kardus berhasil. +120 poin reward.
        type:
          type: string
          enum: [DEPOSIT_SUCCESS, STATION_ALERT, RECYCLE_UPDATE, REDEMPTION]
          description: Kategori notifikasi
          example: DEPOSIT_SUCCESS
        is_read:
          type: boolean
          description: Status apakah notifikasi sudah dibaca pengguna
          example: false
        created_at:
          type: string
          format: date-time

  responses:
    BadRequestError:
      description: |
        ### 🔴 HTTP 400 Bad Request
        Validasi input gagal. Terjadi apabila:
        - Parameter wajib tidak diisi.
        - Format `stationId`, `compartmentId`, atau `id` bukan UUID v4 yang valid.
        - Nilai `weightOrCount` atau `pointsRedeemed` bernilai `0`, negatif, atau saniter bukan angka.
        - Jenis kemasan `wasteType` atau `eWalletProvider` tidak sesuai daftar enum.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Nilai weightOrCount harus berupa angka positif (lebih dari 0)
            error: null

    UnauthorizedError:
      description: |
        ### 🟡 HTTP 401 Unauthorized
        Akses ditolak. Terjadi apabila:
        - Header `Authorization: Bearer <TOKEN>` tidak disertakan dalam request.
        - Token JWT Supabase sudah kedaluwarsa atau malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token tidak valid atau telah kedaluwarsa.
            error: invalid JWT: unable to parse or verify signature

    NotFoundError:
      description: |
        ### 🟠 HTTP 404 Not Found
        Resource atau data tidak ditemukan di database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data transaksi setoran tidak ditemukan.
            error: null

    InternalServerError:
      description: |
        ### 🚨 HTTP 500 Internal Server Error
        Terjadi kesalahan tidak terduga pada server backend Express.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Terjadi kesalahan internal pada server. Silakan coba lagi nanti.
            error: null

paths:
  /:
    get:
      summary: Health Check Server Backend
      description: |
        Endpoint ini digunakan untuk memantau apakah server Express PackLoop aktif berjalan dan siap menerima request.
      responses:
        '200':
          description: Server berjalan lancar & sehat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: PackLoop Backend API is running smoothly!
                data:
                  timestamp: "2026-07-24T17:20:00.000Z"
                  environment: development
                  documentation: http://localhost:5000/docs

  /api/auth/verify-token:
    post:
      tags:
        - Autentikasi
      summary: Verifikasi Supabase Auth Token (Login Mobile)
      description: |
        Memverifikasi JWT Access Token yang didapatkan dari Supabase Auth setelah pengguna berhasil login (via Google OAuth atau Phone OTP).
        Jika profil pengguna belum ada di tabel `profiles`, sistem backend akan otomatis memicu pembuatan profil awal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: JWT Access Token dari Supabase Auth
                  example: eyJhbGciOiJFUzI1NiIs...
      responses:
        '200':
          description: Token valid dan profil pengguna dikembalikan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Token autentikasi valid
                data:
                  user:
                    id: 53c82597-7e19-4f35-affa-aac08022c634
                    email: indy@gmail.com
                  profile:
                    full_name: Indy Agustin
                    total_points: 1250
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags:
        - Autentikasi
      summary: Ambil Data Sesi Pengguna Aktif
      description: |
        Mengembalikan data detail pengguna yang sedang login berdasarkan Header `Authorization: Bearer <TOKEN>`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data pengguna aktif dikembalikan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Berhasil mengambil sesi pengguna
                data:
                  user:
                    id: 53c82597-7e19-4f35-affa-aac08022c634
                    email: indy@gmail.com
                  profile:
                    full_name: Indy Agustin
                    total_points: 1250
                    total_weight_kg: 50.00
                    total_carbon_saved_kg: 75.00
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/profile:
    get:
      tags:
        - User Profile & Dashboard
      summary: Ambil Profil & Dasbor Pengguna
      description: |
        Mengambil profil lengkap pengguna beserta statistik ringkasan dasbor (total poin reward, total berat kemasan daur ulang kg, dan total emisi karbon yang berhasil dihemat).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data profil dan statistik dasbor dikembalikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Berhasil mengambil profil pengguna
                  data:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - User Profile & Dashboard
      summary: Update Profil Pengguna
      description: |
        Memperbarui informasi nama lengkap, nomor telepon, atau URL foto avatar pengguna.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  description: Nama lengkap baru
                  example: Indy Agustin
                phone_number:
                  type: string
                  description: Nomor telepon baru
                  example: "081234567890"
                avatar_url:
                  type: string
                  description: Link URL foto profil baru
                  example: https://lh3.googleusercontent.com/a/ACg8ocL...
      responses:
        '200':
          description: Profil berhasil di-update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Profil berhasil diperbarui!
                data:
                  id: 53c82597-7e19-4f35-affa-aac08022c634
                  full_name: Indy Agustin
                  phone_number: "081234567890"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - User Profile & Dashboard
      summary: Hapus Akun & Seluruh Data Pengguna (Permanent Delete)
      description: |
        Menghapus akun pengguna dari Supabase Auth secara permanen. Seluruh data riwayat setoran, poin, dan notifikasi terkait akan terhapus bersih (*Cascade Delete*).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Akun dan seluruh data terhapus permanen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Akun berhasil dihapus secara permanen
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stations:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Daftar Seluruh Stasiun & Kapasitas Kompartemen
      description: |
        Digunakan oleh aplikasi Mobile (Layar Peta/Maps) untuk menampilkan lokasi seluruh PackCycle Station di peta, beserta status kapasitas kompartemennya (Kardus, Bubble Wrap, Tote Bag).
      responses:
        '200':
          description: Daftar stasiun dan kompartemen dikembalikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Berhasil mengambil daftar stasiun
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stations/{id}:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Detail 1 Stasiun Spesifik
      description: |
        Mengambil detail informasi stasiun fisik berdasarkan UUID stasiun.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v4 unik dari stasiun
          schema:
            type: string
            format: uuid
            example: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Detail stasiun dikembalikan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stations/{id}/compartments:
    get:
      tags:
        - Maps & Stasiun PackCycle
      summary: Ambil Kapasitas Kompartemen Real-Time Stasiun
      description: |
        Mengambil pantauan berat muatan saat ini, kapasitas maksimum, dan status ketersediaan kompartemen penampungan di stasiun tersebut.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v4 unik stasiun
          schema:
            type: string
            format: uuid
            example: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Daftar status kompartemen stasiun.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/deposits/analyze:
    post:
      tags:
        - Setor Kemasan (Drop-off)
      summary: AI Scan Analisis Foto Kemasan (Gemini Vision)
      description: |
        Menganalisis foto kemasan daur ulang menggunakan **Google Gemini 2.5 Flash Vision AI**.

        AI akan secara otomatis:
        1. Mengidentifikasi jenis kemasan (`TOTE_BAG` atau `PAPER_BAG`).
        2. Menilai kelayakan fisik (`LAYAK` vs `TIDAK_LAYAK`) beserta alasan.
        3. Menghitung jumlah barang (*Visual Quantity Counting*) per unit/pcs.
        4. Mendeteksi foto layar monitor (`isScreenPhoto`).
        5. Memberikan skor kepastian (`confidenceScore`).

        **7 Sistem Pengaman Anti-Kecurangan** diterapkan secara otomatis di backend.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageBase64
                - mimeType
              properties:
                imageBase64:
                  type: string
                  description: String Base64 dari foto kemasan (tanpa prefix "data:image/...;base64,"). Maksimal 5MB.
                  example: "/9j/4AAQSkZJRgABAQ..."
                mimeType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  description: Tipe MIME gambar
                  example: image/jpeg
      responses:
        '200':
          description: Analisis kemasan berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Analisis kemasan berhasil
                data:
                  isEligible: true
                  status: LAYAK
                  wasteType: TOTE_BAG
                  quantity: 2
                  confidenceScore: 0.96
                  isScreenPhoto: false
                  reason: "Terdeteksi 2 tote bag kain dalam kondisi bersih dan utuh"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/deposits:
    post:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Catat Transaksi Setor Kemasan Baru (Scan QR / IoT Drop-off)
      description: |
        Mencatat transaksi setoran kemasan baru saat pengguna melakukan scan QR Code di mesin PackCycle Station.
        Sistem backend akan otomatis:
        1. Memverifikasi kelayakan kompartemen.
        2. Menghitung poin reward dan estimasi *carbon saved*.
        3. Menambahkan poin langsung ke profil pengguna.
        4. Mengupdate kapasitas kompartemen stasiun.
        5. Membuat entri notifikasi real-time.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stationId
                - compartmentId
                - wasteType
                - weightOrCount
              properties:
                stationId:
                  type: string
                  format: uuid
                  description: UUID v4 stasiun tempat penyetoran
                  example: 11111111-1111-1111-1111-111111111111
                compartmentId:
                  type: string
                  format: uuid
                  description: UUID v4 kompartemen tempat penyetoran
                  example: a1111111-1111-1111-1111-111111111111
                wasteType:
                  type: string
                  enum: [TOTE_BAG, PAPER_BAG]
                  description: Jenis kemasan (CARDBOARD, BUBBLE_WRAP, TOTE_BAG)
                  example: CARDBOARD
                weightOrCount:
                  type: number
                  format: float
                  description: Berat dalam kg (atau jumlah unit untuk tote bag). Harus berupa angka positif > 0.
                  example: 1.2
      responses:
        '201':
          description: Setoran berhasil dicatat, poin reward & emisi karbon terhitung instan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Setoran kemasan berhasil dicatat!
                data:
                  id: 99999999-9999-9999-9999-999999999999
                  order_code: PL-20260724-888
                  waste_type: CARDBOARD
                  weight_or_count: 1.2
                  reward_points_earned: 120
                  carbon_saved_kg: 1.8
                  status: DEPOSITED
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Ambil Riwayat Setoran Milik User
      description: |
        Mengambil daftar seluruh riwayat transaksi setoran kemasan milik pengguna yang sedang login.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar riwayat setoran dikembalikan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/deposits/{id}:
    get:
      tags:
        - Setor Kemasan (Drop-off)
      summary: Ambil Detail Setoran & Timeline Order Tracking
      description: |
        Mengambil detail transaksi setoran spesifik beserta log timeline *Order Tracking daur ulang* (Status: DEPOSITED ➔ SORTED ➔ PICKED_UP ➔ IN_TRANSIT ➔ RECYCLED).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v4 unik transaksi setoran
          schema:
            type: string
            format: uuid
            example: 99999999-9999-9999-9999-999999999999
      responses:
